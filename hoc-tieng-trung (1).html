<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Học Tiếng Trung – Từ con số 0 cho người Việt</title>
<meta name="description" content="Lộ trình tự học tiếng Trung từ con số 0 cho người Việt: Pinyin, thanh điệu, từ vựng, ngữ pháp, chữ Hán, hội thoại, flashcard, ôn tập thông minh và luyện thi HSK.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ============ Tokens ============ */
:root {
  --paper: #EEF2EF;
  --surface: #FFFFFF;
  --surface-2: #F6F8F6;
  --ink: #1D2B2A;
  --ink-soft: #3A4A48;
  --muted: #5F6F6C;
  --line: #D6DFDB;
  --grid: #E7B9B2;
  --seal: #B8322A;
  --seal-ink: #FFFFFF;
  --seal-soft: #F7E3E0;
  --jade: #2C7A68;
  --jade-soft: #DCEFE9;
  --gold: #B7841B;
  --t1: #D23F33;
  --t2: #D98314;
  --t3: #2A8A55;
  --t4: #2F68B3;
  --t0: #7D8784;
  --ok: #2A8A55;
  --ok-soft: #DDF1E5;
  --bad: #C2372D;
  --bad-soft: #F9E1DE;
  --shadow: 0 1px 2px rgba(29,43,42,.06), 0 6px 18px rgba(29,43,42,.06);
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 22px;
  --font-ui: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-han: "Noto Serif SC", "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111918; --surface: #18221F; --surface-2: #1E2A27; --ink: #E5ECE9; --ink-soft: #C6D1CD;
    --muted: #93A29E; --line: #2D3B38; --grid: #6B3A35; --seal: #E0584B; --seal-ink: #1A0A08; --seal-soft: #3A1E1B;
    --jade: #5CC0A6; --jade-soft: #173A32; --gold: #E0B04A;
    --t1: #FF6B5E; --t2: #F2A23C; --t3: #4FC283; --t4: #6FA3F0; --t0: #8E9A97;
    --ok: #4FC283; --ok-soft: #173826; --bad: #FF6B5E; --bad-soft: #3D1C19;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111918; --surface: #18221F; --surface-2: #1E2A27; --ink: #E5ECE9; --ink-soft: #C6D1CD;
  --muted: #93A29E; --line: #2D3B38; --grid: #6B3A35; --seal: #E0584B; --seal-ink: #1A0A08; --seal-soft: #3A1E1B;
  --jade: #5CC0A6; --jade-soft: #173A32; --gold: #E0B04A;
  --t1: #FF6B5E; --t2: #F2A23C; --t3: #4FC283; --t4: #6FA3F0; --t0: #8E9A97;
  --ok: #4FC283; --ok-soft: #173826; --bad: #FF6B5E; --bad-soft: #3D1C19;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
body {
  margin: 0; min-height: 100%; background: var(--paper); color: var(--ink);
  font-family: var(--font-ui); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased;
}
img, svg { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--jade); }
:focus-visible { outline: 3px solid var(--t4); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ============ Layout ============ */
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 22px 14px 18px;
  border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 6px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 16px; text-decoration: none; color: var(--ink); }
.brand-seal {
  width: 40px; height: 40px; border-radius: 9px; background: var(--seal); color: var(--seal-ink);
  display: grid; place-items: center; font-family: var(--font-han); font-size: 22px; font-weight: 700;
}
.brand b { display: block; font-size: 17px; line-height: 1.2; }
.brand small { color: var(--muted); font-size: 12.5px; }
.nav-group { margin: 10px 10px 2px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.nav a {
  display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 10px;
  color: var(--ink-soft); text-decoration: none; font-weight: 500; font-size: 15px;
}
.nav a .ic { width: 26px; font-family: var(--font-han); font-size: 17px; text-align: center; color: var(--muted); }
.nav a:hover { background: var(--surface-2); }
.nav a.on { background: var(--seal-soft); color: var(--seal); }
.nav a.on .ic { color: var(--seal); }
.side-foot { margin-top: auto; padding: 12px 10px 0; font-size: 12.5px; color: var(--muted); }
.sync-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--t0); margin-right: 6px; vertical-align: 1px; }
.sync-dot.on { background: var(--ok); }

.main { min-width: 0; padding: 28px clamp(16px, 4vw, 48px) 110px; }
.wrap { max-width: 1080px; margin: 0 auto; }

.topbar { display: none; }
.tabbar { display: none; }

@media (max-width: 880px) {
  .app { grid-template-columns: 1fr; }
  .side {
    position: fixed; inset: 0 auto 0 0; width: min(300px, 84vw); z-index: 40; transform: translateX(-105%);
    transition: transform .25s ease; box-shadow: var(--shadow); padding-top: calc(22px + env(safe-area-inset-top, 0px));
  }
  .side.open { transform: none; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 39; }
  .topbar {
    display: flex; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 14px;
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
  .topbar .brand { padding: 0; }
  .topbar .brand-seal { width: 34px; height: 34px; font-size: 19px; }
  .topbar .spacer { flex: 1; }
  .main { padding: 18px 14px 110px; }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .tabbar a, .tabbar button {
    display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 0; text-decoration: none;
    color: var(--muted); font-size: 11.5px; font-weight: 500; background: none; border: 0; cursor: pointer;
  }
  .tabbar .ic { font-family: var(--font-han); font-size: 20px; line-height: 1.2; }
  .tabbar .on { color: var(--seal); }
}

/* ============ Type ============ */
h1, h2, h3 { line-height: 1.25; margin: 0 0 .4em; letter-spacing: -0.01em; }
h1 { font-size: clamp(26px, 3.4vw, 34px); font-weight: 700; }
h2 { font-size: 22px; font-weight: 700; }
h3 { font-size: 17.5px; font-weight: 600; }
p { margin: 0 0 .8em; max-width: 72ch; }
.lead { font-size: 17px; color: var(--ink-soft); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.han { font-family: var(--font-han); font-weight: 500; }
.py { font-weight: 500; letter-spacing: .01em; }
.t1 { color: var(--t1); } .t2 { color: var(--t2); } .t3 { color: var(--t3); } .t4 { color: var(--t4); } .t0 { color: var(--t0); }
.page-head { margin-bottom: 22px; }
.page-head p { color: var(--muted); }
.crumbs { font-size: 14px; margin-bottom: 10px; }
.crumbs a { text-decoration: none; color: var(--muted); }
.crumbs a:hover { color: var(--seal); }

/* ============ Primitives ============ */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 20px; }
.panel + .panel { margin-top: 16px; }
.grid > .panel, .grid > .panel + .panel { margin-top: 0; }
.sec { margin-top: 30px; }
.sec > h2 { margin-bottom: 12px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.auto { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
@media (max-width: 880px) { .g3, .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .g2, .g3 { grid-template-columns: 1fr; } }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack > * + * { margin-top: 10px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 9px 16px;
  border-radius: 11px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none; transition: background .15s, transform .08s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--seal); border-color: var(--seal); color: var(--seal-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.jade { background: var(--jade); border-color: var(--jade); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.sm { min-height: 34px; padding: 5px 12px; font-size: 14px; border-radius: 9px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.block { width: 100%; }

.say {
  display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); color: var(--jade); cursor: pointer; flex: none; vertical-align: middle;
}
.say:hover { background: var(--jade-soft); }
.say.lg { width: 56px; height: 56px; }
.say svg { width: 18px; height: 18px; }
.say.lg svg { width: 26px; height: 26px; }
.say.playing { background: var(--jade); color: #fff; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 13px;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-soft); font-weight: 500;
}
.chip.lv1 { background: var(--jade-soft); color: var(--jade); border-color: transparent; }
.chip.lv2 { background: #F3E8D2; color: #8A6212; border-color: transparent; }
.chip.lv3 { background: var(--seal-soft); color: var(--seal); border-color: transparent; }
:root[data-theme="dark"] .chip.lv2 { background: #3A2F17; color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip.lv2 { background: #3A2F17; color: var(--gold); } }

.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 18px; scrollbar-width: none; }
.tabs button {
  white-space: nowrap; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  cursor: pointer; font-weight: 600; font-size: 14.5px; color: var(--ink-soft);
}
.tabs button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--jade); border-radius: 99px; transition: width .4s ease; }

.input, select.input, textarea.input {
  width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface);
  font-size: 16px;
}
.input:focus { outline: 2px solid var(--t4); outline-offset: 0; }
label.f { display: block; font-weight: 600; font-size: 14.5px; margin: 14px 0 6px; }

.note { border-left: 4px solid var(--gold); background: var(--surface-2); padding: 12px 16px; border-radius: 0 10px 10px 0; margin: 14px 0; }
.note b { color: var(--gold); }
.note.vn { border-left-color: var(--seal); }
.note.vn b { color: var(--seal); }

.table { width: 100%; border-collapse: collapse; font-size: 15px; }
.table th, .table td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table th { color: var(--muted); font-weight: 600; font-size: 13.5px; }
.scroll-x { overflow-x: auto; }

/* ============ Tianzige (田字格) ============ */
.tzg {
  position: relative; display: grid; place-items: center; aspect-ratio: 1; border: 1.5px solid var(--grid);
  background:
    linear-gradient(var(--grid), var(--grid)) center / 100% 1px no-repeat,
    linear-gradient(var(--grid), var(--grid)) center / 1px 100% no-repeat,
    var(--surface);
  border-radius: 4px; flex: none;
}
.tzg::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .55;
  background:
    linear-gradient(to top right, transparent calc(50% - .5px), var(--grid) calc(50% - .5px), var(--grid) calc(50% + .5px), transparent calc(50% + .5px)),
    linear-gradient(to top left, transparent calc(50% - .5px), var(--grid) calc(50% - .5px), var(--grid) calc(50% + .5px), transparent calc(50% + .5px));
}
.tzg span { position: relative; z-index: 1; font-family: var(--font-han); line-height: 1; color: var(--ink); }
.tzg-row { display: flex; gap: 0; }
.tzg-row .tzg + .tzg { border-left-width: 0; }

/* ============ Dashboard ============ */
.hero {
  display: grid; grid-template-columns: auto 1fr; gap: clamp(18px, 4vw, 40px); align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: clamp(18px, 3vw, 30px);
}
.hero .tzg { width: clamp(130px, 22vw, 200px); }
.hero .tzg span { font-size: clamp(84px, 14vw, 132px); }
.hero .tzg-row .tzg { width: clamp(110px, 18vw, 170px); }
.hero .tzg-row .tzg span { font-size: clamp(70px, 11vw, 112px); }
.hero-label { font-size: 14px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
.hero .py { font-size: 26px; }
.hero .mean { font-size: 21px; font-weight: 600; margin: 2px 0 8px; }
.hero .ex { color: var(--ink-soft); font-size: 15.5px; }
@media (max-width: 640px) { .hero { grid-template-columns: 1fr; justify-items: start; } }

.today { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.ring { width: 104px; height: 104px; }
.ring circle { fill: none; stroke-width: 10; }
.ring .bg { stroke: var(--surface-2); }
.ring .fg { stroke: var(--seal); stroke-linecap: round; transition: stroke-dashoffset .6s ease; transform: rotate(-90deg); transform-origin: 50% 50%; }
.ring text { font-family: var(--font-ui); font-weight: 700; fill: var(--ink); }

.stat b { display: block; font-size: 26px; line-height: 1.15; }
.stat span { color: var(--muted); font-size: 14px; }
.stat .han { color: var(--seal); font-size: 15px; margin-right: 4px; }

.week { display: flex; align-items: flex-end; gap: 10px; height: 130px; padding-top: 6px; }
.week .d { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.week .col { width: 100%; max-width: 34px; background: var(--jade); border-radius: 6px 6px 3px 3px; min-height: 3px; }
.week .col.today { background: var(--seal); }
.week small { font-size: 12px; color: var(--muted); }
.week .v { font-size: 11.5px; color: var(--muted); }

.rec { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
.rec:last-child { border-bottom: 0; }
.rec .ic { width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); font-family: var(--font-han); font-size: 21px; color: var(--seal); flex: none; }
.rec b { display: block; font-size: 15.5px; }
.rec span { color: var(--muted); font-size: 14px; }
.rec:hover b { color: var(--seal); }

.hist { list-style: none; padding: 0; margin: 0; }
.hist li { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 14.5px; }
.hist li:last-child { border-bottom: 0; }
.hist time { color: var(--muted); min-width: 92px; font-size: 13.5px; }
.hist .xp { margin-left: auto; color: var(--jade); font-weight: 600; white-space: nowrap; }

/* ============ Path ============ */
.stage { position: relative; padding-left: 34px; margin-bottom: 30px; }
.stage::before { content: ""; position: absolute; left: 13px; top: 34px; bottom: -24px; width: 2px; background: var(--line); }
.stage:last-child::before { display: none; }
.stage-num {
  position: absolute; left: 0; top: 2px; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--paper);
  display: grid; place-items: center; font-weight: 700; font-size: 14px;
}
.stage.done .stage-num { background: var(--jade); }
.lessons { display: grid; gap: 10px; margin-top: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.lesson {
  display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: var(--r-md); border: 1px solid var(--line);
  background: var(--surface); text-decoration: none; color: inherit;
}
.lesson:hover { border-color: var(--ink-soft); }
.lesson .lh { width: 46px; height: 46px; font-size: 26px; }
.lesson b { display: block; font-size: 15.5px; line-height: 1.3; }
.lesson span { font-size: 13.5px; color: var(--muted); }
.lesson .st { margin-left: auto; font-size: 13px; font-weight: 600; white-space: nowrap; }
.lesson.done .st { color: var(--jade); }
.lesson.next { border: 2px solid var(--seal); }
.lesson.next .st { color: var(--seal); }

/* ============ Word cards ============ */
.words { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.word { display: grid; grid-template-columns: auto 1fr; gap: 14px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
.word > .tzg-row { align-self: start; }
.word .tzg-row .tzg { width: 52px; }
.word .tzg-row .tzg span { font-size: 34px; }
.word .py { font-size: 17px; }
.word .mean { font-weight: 600; }
.word .hv { font-size: 13.5px; color: var(--muted); }
.word .ex { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 14.5px; }
.word .ex .han { font-size: 16.5px; }
.word .acts { display: flex; gap: 6px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
.learned-mark { color: var(--jade); font-size: 13px; font-weight: 600; }

.topic {
  display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: var(--r-md); background: var(--surface);
  border: 1px solid var(--line); text-decoration: none; color: inherit;
}
.topic:hover { border-color: var(--ink-soft); }
.topic .tzg { width: 56px; }
.topic .tzg span { font-size: 34px; color: var(--seal); }
.topic b { display: block; font-size: 16px; }
.topic span.m { color: var(--muted); font-size: 13.5px; }

/* ============ Pinyin ============ */
.pygrid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.pykey {
  text-align: left; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer;
}
.pykey:hover { border-color: var(--jade); }
.pykey .k { font-size: 24px; font-weight: 700; color: var(--ink); }
.pykey .e { font-size: 14px; color: var(--muted); }
.pykey .e .han { font-size: 16px; color: var(--ink); }
.pykey .h { font-size: 13px; color: var(--ink-soft); margin-top: 4px; line-height: 1.4; }
.tone-cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.tone-card { padding: 16px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); }
.tone-card > svg { width: 100%; height: 90px; display: block; margin: 6px 0; }
.tone-card .big { font-size: 30px; font-weight: 700; }

/* ============ Quiz ============ */
.quiz { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: clamp(16px, 3vw, 28px); }
.quiz-top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.quiz-top .bar { flex: 1; }

  formula: "Câu trần thuật + 吗？",
  explain: "Thêm 吗 vào cuối một câu trần thuật là thành câu hỏi có/không, giống “…không?”, “…à?” của tiếng Việt. Trả lời bằng cách lặp lại động từ hoặc tính từ chính: 是 / 不是, 喜欢 / 不喜欢.",
  vn: "Không được dùng 吗 cùng với từ để hỏi (什么, 谁, 哪儿…). 你叫什么名字吗？ là sai vì câu đã có 什么 để hỏi rồi.",
  examples: [["你是学生吗？","nǐ shì xué sheng ma?","Bạn là học sinh à?"],["你忙吗？","nǐ máng ma?","Bạn có bận không?"],["你喜欢喝茶吗？","nǐ xǐ huan hē chá ma?","Bạn có thích uống trà không?"]],
  ex: [
    { type: "mc", q: "Biến câu 他是医生。thành câu hỏi:", opts: ["他是医生吗？","吗他是医生？","他吗是医生？","他是吗医生？"], a: 0, why: "吗 luôn đứng ở cuối câu trần thuật. Chỉ cần giữ nguyên câu và thêm 吗 vào cuối." },
    { type: "mc", q: "Câu nào SAI?", opts: ["你好吗？","你是越南人吗？","你叫什么名字吗？","你去学校吗？"], a: 2, why: "Câu 3 đã có từ để hỏi 什么 nên không được thêm 吗. Câu đúng là 你叫什么名字？" },
    { type: "order", q: "Bạn có thích cà phê không?", tokens: ["你","喜欢","咖啡","吗"], py: "nǐ xǐ huan kā fēi ma?", why: "Câu trần thuật 你喜欢咖啡 + 吗 ở cuối." }
  ]
},
{
  id: "g3", lv: 1, title: "Tính từ làm vị ngữ với 很 (hěn)",
  formula: "Chủ ngữ + 很 + Tính từ　|　Chủ ngữ + 不 + Tính từ",
  explain: "Trong tiếng Trung, tính từ có thể trực tiếp làm vị ngữ, không cần động từ “là”. Câu khẳng định thường thêm 很 trước tính từ. Lúc này 很 nhiều khi không còn nghĩa “rất” mạnh mà chỉ giúp câu tự nhiên, trọn vẹn. Phủ định thì dùng 不 thay cho 很.",
  vn: "Người Việt hay nói “Tôi khỏe” nên dễ viết 我好. Câu này nghe cụt và giống đang so sánh. Hãy nói 我很好.",
  examples: [["我很好。","wǒ hěn hǎo.","Tôi khỏe."],["汉语不难。","Hàn yǔ bù nán.","Tiếng Trung không khó."],["今天很热。","jīn tiān hěn rè.","Hôm nay nóng."]],
  ex: [
    { type: "mc", q: "Chọn câu tự nhiên nhất cho “Hôm nay lạnh.”", opts: ["今天是冷。","今天很冷。","今天冷是。","是今天冷。"], a: 1, why: "冷 (lạnh) là tính từ nên dùng 很 + tính từ, không dùng 是." },
    { type: "mc", q: "Phủ định của 我很忙 là:", opts: ["我很不忙。","我不是忙。","我不忙。","我没忙。"], a: 2, why: "Phủ định tính từ dùng 不 thay vào chỗ của 很: 我不忙 (Tôi không bận)." },
    { type: "order", q: "Tiếng Trung không khó lắm.", tokens: ["汉语","不","太","难"], py: "Hàn yǔ bú tài nán.", why: "不太 + tính từ = “không … lắm”. 不 đọc là bú vì đứng trước 太 (thanh 4)." }
  ]
},
{
  id: "g4", lv: 1, title: "Trợ từ sở hữu 的 (de)",
  formula: "Người sở hữu + 的 + Vật / Người",
  explain: "的 tương đương “của”, nhưng trật tự NGƯỢC với tiếng Việt: người sở hữu đứng trước, vật đứng sau. 我的书 = sách của tôi. Với người thân hoặc tổ chức gần gũi có thể bỏ 的: 我妈妈, 我家, 我们公司.",
  vn: "Mẹo nhớ: đọc tiếng Trung từ phải sang trái khi dịch. 老师的电脑 → máy tính (电脑) của (的) giáo viên (老师).",
  examples: [["这是我的手机。","zhè shì wǒ de shǒu jī.","Đây là điện thoại của tôi."],["我妈妈是医生。","wǒ mā ma shì yī shēng.","Mẹ tôi là bác sĩ."],["老师的电脑很新。","lǎo shī de diàn nǎo hěn xīn.","Máy tính của thầy giáo rất mới."]],
  ex: [
    { type: "mc", q: "“Bạn của tôi” là:", opts: ["朋友的我","我的朋友","的我朋友","朋友我的"], a: 1, why: "Người sở hữu (我) + 的 + danh từ (朋友). Trật tự ngược với tiếng Việt." },
    { type: "order", q: "Đây là cốc của tôi.", tokens: ["这","是","我的","杯子"], py: "zhè shì wǒ de bēi zi.", why: "这 + 是 + (我的 + 杯子). Cụm sở hữu 我的杯子 = cốc của tôi." },
    { type: "mc", q: "Cách nói tự nhiên nhất cho “bố tôi”:", opts: ["我的爸爸","爸爸我","我爸爸","爸爸的我"], a: 2, why: "Với người thân thường lược 的: 我爸爸. 我的爸爸 không sai nhưng kém tự nhiên hơn trong khẩu ngữ." }
  ]
},
{
  id: "g5", lv: 1, title: "Số từ + Lượng từ + Danh từ",
  formula: "Số + Lượng từ + Danh từ　|　这/那 + Lượng từ + Danh từ",
  explain: "Giữa số và danh từ bắt buộc có lượng từ, giống “cái, con, quyển, chiếc” trong tiếng Việt. 个 là lượng từ chung dùng được nhiều nhất. Một số lượng từ hay gặp: 本 (quyển sách), 杯 (cốc), 件 (bộ quần áo, việc), 口 (người trong gia đình), 张 (tờ, cái bàn).",
  vn: "Số 2 đứng trước lượng từ phải dùng 两 chứ không dùng 二: 两个人 (hai người), không nói 二个人. Khi đếm số thì vẫn dùng 二: 一、二、三.",
  examples: [["三个人","sān gè rén","ba người"],["两杯咖啡","liǎng bēi kā fēi","hai cốc cà phê"],["这件衣服","zhè jiàn yī fu","bộ quần áo này"]],
  ex: [
    { type: "mc", q: "“Hai cốc trà” là:", opts: ["二杯茶","两杯茶","两茶杯","二茶"], a: 1, why: "Trước lượng từ (杯) dùng 两, không dùng 二. Trật tự: số + lượng từ + danh từ." },
    { type: "mc", q: "我家有四___人。Điền lượng từ:", opts: ["本","杯","口","件"], a: 2, why: "口 (khẩu – miệng) là lượng từ dùng khi đếm thành viên trong gia đình: 四口人." },
    { type: "order", q: "Tôi muốn mua một bộ quần áo.", tokens: ["我","想","买","一件","衣服"], py: "wǒ xiǎng mǎi yí jiàn yī fu.", why: "Chủ ngữ + 想 + động từ 买 + (一件衣服). 件 là lượng từ cho quần áo." }
  ]
},
{
  id: "g6", lv: 1, title: "Vị trí của thời gian và địa điểm",
  formula: "Chủ ngữ + Thời gian + 在 + Địa điểm + Động từ + Tân ngữ",
  explain: "Thời gian và địa điểm luôn đứng TRƯỚC động từ. Thời gian có thể đứng đầu câu hoặc ngay sau chủ ngữ, nhưng không bao giờ đứng cuối câu như tiếng Việt.",
  vn: "Đây là lỗi phổ biến nhất của người Việt. “Tôi ăn cơm ở nhà” KHÔNG dịch là 我吃饭在家 mà là 我在家吃饭. “Tôi đi Bắc Kinh ngày mai” → 我明天去北京.",
  examples: [["我在家吃饭。","wǒ zài jiā chī fàn.","Tôi ăn cơm ở nhà."],["我明天去北京。","wǒ míng tiān qù Běi jīng.","Ngày mai tôi đi Bắc Kinh."],["他晚上在公司工作。","tā wǎn shang zài gōng sī gōng zuò.","Buổi tối anh ấy làm việc ở công ty."]],
  ex: [
    { type: "mc", q: "“Tôi học tiếng Trung ở trường” là:", opts: ["我学习汉语在学校。","我在学校学习汉语。","在学校我汉语学习。","我学习在学校汉语。"], a: 1, why: "在 + địa điểm phải đứng trước động từ: 我 + 在学校 + 学习汉语." },
    { type: "order", q: "Ba giờ chiều chúng ta họp.", tokens: ["我们","下午","三点","开会"], py: "wǒ men xià wǔ sān diǎn kāi huì.", why: "Thời gian (下午三点) đứng trước động từ 开会. Cũng có thể nói 下午三点我们开会." },
    { type: "mc", q: "Câu nào ĐÚNG?", opts: ["我工作在医院。","我去北京明天。","我在医院工作。","我工作明天。"], a: 2, why: "Chỉ câu 3 đặt địa điểm (在医院) trước động từ (工作). Hai câu đầu đặt địa điểm và thời gian sau động từ theo kiểu tiếng Việt nên sai." }
  ]
},
{
  id: "g7", lv: 1, title: "Đại từ nghi vấn: 什么, 谁, 哪儿, 几, 多少",
  formula: "Thay thông tin cần hỏi bằng từ để hỏi, giữ nguyên vị trí",
  explain: "什么 (cái gì), 谁 (ai), 哪儿 (ở đâu), 几 (mấy, cho số dưới 10), 多少 (bao nhiêu, số lớn hoặc chưa biết), 怎么 (thế nào), 什么时候 (khi nào). Muốn hỏi thông tin nào thì đặt từ để hỏi vào đúng vị trí của thông tin đó trong câu trả lời.",
  vn: "Tin vui: quy tắc này giống hệt tiếng Việt! “Bạn đi đâu?” → 你去哪儿？ Câu trả lời: 我去学校. Chỉ cần thay 哪儿 bằng 学校.",
  examples: [["你叫什么名字？","nǐ jiào shén me míng zi?","Bạn tên là gì?"],["他是谁？","tā shì shéi?","Anh ấy là ai?"],["这个多少钱？","zhè ge duō shao qián?","Cái này bao nhiêu tiền?"]],
  ex: [
    { type: "mc", q: "Hỏi số người trong lớp học (khoảng 30 người), dùng từ nào?", opts: ["几","多少","什么","谁"], a: 1, why: "几 dùng khi đoán số nhỏ hơn 10. Số lớn hoặc không đoán được thì dùng 多少: 你们班有多少学生？" },
    { type: "mc", q: "A: 你去哪儿？ B: ___", opts: ["我去学校。","我是学生。","我很好。","我叫阿明。"], a: 0, why: "哪儿 hỏi địa điểm, nên câu trả lời phải là một nơi chốn: 我去学校 (Tôi đến trường)." },
    { type: "order", q: "Bạn muốn ăn gì?", tokens: ["你","想","吃","什么"], py: "nǐ xiǎng chī shén me?", why: "Trật tự giống tiếng Việt: 你 (bạn) 想 (muốn) 吃 (ăn) 什么 (gì)." }
  ]
},
{
  id: "g8", lv: 1, title: "Phó từ 也 (cũng) và 都 (đều)",
  formula: "Chủ ngữ + 也 / 都 + Động từ / Tính từ",
  explain: "也 = cũng, 都 = đều, tất cả. Cả hai luôn đứng sau chủ ngữ và trước động từ hoặc tính từ. Khi dùng cùng nhau thì 也 đứng trước 都: 我们也都是学生.",
  vn: "Không đặt 也 ở đầu câu hay cuối câu như “cũng” đôi khi xuất hiện trong tiếng Việt. Sai: 也我是学生. Đúng: 我也是学生.",
  examples: [["我也是学生。","wǒ yě shì xué sheng.","Tôi cũng là học sinh."],["我们都是越南人。","wǒ men dōu shì Yuè nán rén.","Chúng tôi đều là người Việt Nam."],["他们也都喜欢喝茶。","tā men yě dōu xǐ huan hē chá.","Họ cũng đều thích uống trà."]],
  ex: [
    { type: "mc", q: "“Tôi cũng rất bận” là:", opts: ["也我很忙。","我很也忙。","我也很忙。","我很忙也。"], a: 2, why: "也 đứng sau chủ ngữ, trước phó từ mức độ và tính từ: 我 + 也 + 很忙." },
    { type: "order", q: "Đồng nghiệp của tôi đều rất thân thiện.", tokens: ["我的同事","都","很","友好"], py: "wǒ de tóng shì dōu hěn yǒu hǎo.", why: "Chủ ngữ (我的同事) + 都 + 很 + tính từ (友好)." }
  ]
},
{
  id: "g9", lv: 1, title: "Động từ năng nguyện: 想, 要, 会, 能",
  formula: "Chủ ngữ + 想/要/会/能 + Động từ",
  explain: "想: muốn (mong muốn, nhẹ nhàng). 要: muốn, phải (quyết tâm hơn; khi gọi món cũng dùng 要). 会: biết làm (kỹ năng phải học mới có, như nói tiếng Trung, bơi, lái xe) hoặc “sẽ”. 能: có thể (có đủ điều kiện, khả năng).",
  vn: "“Biết” trong tiếng Việt có hai nghĩa. Biết một kỹ năng → 会: 我会说汉语. Biết một thông tin → 知道: 我知道他的名字.",
  examples: [["我想去中国。","wǒ xiǎng qù Zhōng guó.","Tôi muốn đi Trung Quốc."],["我要一杯咖啡。","wǒ yào yì bēi kā fēi.","Tôi muốn (lấy) một cốc cà phê."],["你会说汉语吗？","nǐ huì shuō Hàn yǔ ma?","Bạn biết nói tiếng Trung không?"],["明天你能来吗？","míng tiān nǐ néng lái ma?","Ngày mai bạn có thể đến không?"]],
  ex: [
    { type: "mc", q: "我___游泳。(Tôi biết bơi – đã học)", opts: ["想","会","要","是"], a: 1, why: "Bơi là kỹ năng phải học mới biết, nên dùng 会." },
    { type: "mc", q: "Ở quán cà phê, gọi món: “Cho tôi một cốc trà sữa.” Chọn từ phù hợp nhất: 我___一杯奶茶。", opts: ["会","能","要","是"], a: 2, why: "Khi gọi món, mua hàng người Trung Quốc thường dùng 要 (muốn lấy)." },
    { type: "order", q: "Tôi muốn đi du lịch Trung Quốc.", tokens: ["我","想","去","中国","旅游"], py: "wǒ xiǎng qù Zhōng guó lǚ yóu.", why: "Chủ ngữ + 想 + động từ 去 + địa điểm + 旅游." }
  ]
},
{
  id: "g10", lv: 2, title: "Trợ từ 了 (le) – hoàn thành và thay đổi",
  formula: "Động từ + 了 (+ tân ngữ)　|　…了 (cuối câu)　|　没 + Động từ (phủ định)",
  explain: "了 sau động từ cho biết hành động đã xảy ra, đã hoàn thành: 我买了一件衣服. 了 ở cuối câu báo hiệu một tình huống mới, sự thay đổi: 下雨了 (Trời mưa rồi). Phủ định hành động đã xảy ra dùng 没 (hoặc 没有) và BỎ 了.",
  vn: "了 gần với “đã” và “rồi” nhưng không hoàn toàn trùng. Lỗi hay gặp: 我没去了 (sai). Câu đúng: 我没去 (Tôi đã không đi / chưa đi).",
  examples: [["我吃了。","wǒ chī le.","Tôi ăn rồi."],["我买了一件衣服。","wǒ mǎi le yí jiàn yī fu.","Tôi đã mua một bộ quần áo."],["下雨了。","xià yǔ le.","Trời mưa rồi."],["昨天我没去学校。","zuó tiān wǒ méi qù xué xiào.","Hôm qua tôi không đến trường."]],
  ex: [
    { type: "mc", q: "Phủ định của 我去了 là:", opts: ["我不去了。","我没去了。","我没去。","我不去。"], a: 2, why: "Phủ định của hành động đã xảy ra dùng 没 + động từ và bỏ 了: 我没去. (我不去 nghĩa là “Tôi không đi” – ý định, chưa xảy ra.)" },
    { type: "order", q: "Hôm qua trời mưa.", tokens: ["昨天","下雨","了"], py: "zuó tiān xià yǔ le.", why: "Thời gian 昨天 đứng đầu, 了 cuối câu cho biết sự việc đã xảy ra." },
    { type: "mc", q: "你吃饭了吗？Trả lời “Chưa ăn”:", opts: ["不吃。","没吃。","吃了。","不吃了。"], a: 1, why: "Hỏi việc đã xảy ra chưa → trả lời phủ định bằng 没 + động từ: 没吃 (hoặc 还没吃)." }
  ]
},
{
  id: "g11", lv: 2, title: "Đang làm gì: 正在…呢",
  formula: "Chủ ngữ + (正)在 + Động từ + (呢)",
  explain: "在 hoặc 正在 đặt trước động từ diễn tả hành động đang diễn ra, giống “đang”. 呢 ở cuối câu làm câu tự nhiên hơn và có thể dùng một mình: 他吃饭呢. Phủ định: 没(在) + động từ.",
  vn: "Lưu ý 在 có hai nghĩa: “ở” (+ địa điểm) và “đang” (+ động từ). 他在吃饭 = anh ấy đang ăn. 他在家 = anh ấy ở nhà.",
  examples: [["他正在吃饭呢。","tā zhèng zài chī fàn ne.","Anh ấy đang ăn cơm."],["你在做什么？","nǐ zài zuò shén me?","Bạn đang làm gì?"],["我在学习汉语。","wǒ zài xué xí Hàn yǔ.","Tôi đang học tiếng Trung."]],
  ex: [
    { type: "mc", q: "“Mẹ đang nấu cơm” là:", opts: ["妈妈正在做饭呢。","妈妈做饭正在。","妈妈呢做饭正在。","正在妈妈做饭。"], a: 0, why: "Chủ ngữ + 正在 + động từ + 呢." },
    { type: "order", q: "Bạn đang làm gì thế?", tokens: ["你","在","做","什么","呢"], py: "nǐ zài zuò shén me ne?", why: "在 (đang) + 做 (làm) + 什么 (gì) + 呢 cuối câu." }
  ]
},
{
  id: "g12", lv: 2, title: "Đã từng: Động từ + 过 (guo)",

/* ================= Tiện ích ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const DAY = 86400000;
const dayKey = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const plainVi = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d");

/* ================= Pinyin & thanh điệu ================= */
const TONE_MARKS = { "\u0304": 1, "\u0301": 2, "\u030C": 3, "\u0300": 4 };
function toneOf(syl) {
  for (const ch of String(syl).normalize("NFD")) if (TONE_MARKS[ch]) return TONE_MARKS[ch];
  return 0;
}
function colorPy(py) {
  return String(py).split(/(\s+)/).map(tok => {
    if (!/[a-zA-Zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/.test(tok)) return esc(tok);
    return `<span class="t${toneOf(tok)}">${esc(tok)}</span>`;
  }).join("");
}
const stripTones = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
function applyTone(syl, t) {
  const base = String(syl).normalize("NFD").replace(/[\u0300\u0301\u0304\u030C]/g, "").normalize("NFC");
  if (!t) return base;
  const low = base.toLowerCase();
  let idx = low.indexOf("a");
  if (idx < 0) idx = low.indexOf("e");
  if (idx < 0 && low.includes("ou")) idx = low.indexOf("o");
  if (idx < 0) { for (let i = low.length - 1; i >= 0; i--) if ("iouü".includes(low[i])) { idx = i; break; } }
  if (idx < 0) return base;
  const mark = ["", "\u0304", "\u0301", "\u030C", "\u0300"][t];
  return (base.slice(0, idx + 1) + mark + base.slice(idx + 1)).normalize("NFC");
}
function retone(py) {
  const parts = py.split(" ");
  const idxs = parts.map((p, i) => /[a-zü]/i.test(p) ? i : -1).filter(i => i >= 0);
  if (!idxs.length) return py;
  const i = idxs[Math.floor(Math.random() * idxs.length)];
  const m = parts[i].match(/^([^,.!?，。！？]*)(.*)$/);
  const cur = toneOf(m[1]);
  const choices = [1, 2, 3, 4].filter(t => t !== cur);
  parts[i] = applyTone(m[1], choices[Math.floor(Math.random() * choices.length)]) + m[2];
  return parts.join(" ");
}
function toneDesc(py) {
  const names = ["thanh nhẹ", "thanh 1", "thanh 2", "thanh 3", "thanh 4"];
  return py.split(" ").filter(s => /[a-zü]/i.test(s)).map(s => `<span class="t${toneOf(s)}">${esc(s)}</span> (${names[toneOf(s)]})`).join(", ");
}
function toNumbered(py) {
  return String(py).split(/\s+/).filter(Boolean).map(s => {
    const t = toneOf(s);
    return stripTones(s).replace(/[^a-z]/g, "") + (t || "");
  }).join("");
}
function normalizePyInput(s) {
  return String(s).toLowerCase().replace(/v/g, "u").replace(/5/g, "").normalize("NFD").replace(/\u0308/g, "").normalize("NFC");
}

const STORE_KEY = "hocTiengTrung.v1";
const defaultState = () => ({

  settings: { rate: 0.8, voice: "", showPy: true, theme: "auto" },

});
function mergeState(d) {
  const b = defaultState();
  return { ...b, ...d, profile: { ...b.profile, ...(d.profile || {}) }, settings: { ...b.settings, ...(d.settings || {}) } };
}
function loadLocal() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) return mergeState(JSON.parse(raw)); } catch (e) {}
  return defaultState();
}
let S = loadLocal();
function persistLocal() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }
function save() { S.updatedAt = Date.now(); persistLocal(); Cloud.push(); }

/* Đồng bộ theo tài khoản (khi chạy trên claude.ai). Chạy ngoài claude.ai thì chỉ lưu trên trình duyệt. */
const Cloud = {
  ref: null, on: false, timer: null, busy: false, again: false,
  async init() {
    try {
      if (!window.claude || typeof window.claude.use !== "function") return;
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.ref = db.doc("data/users/" + id + "/progress");
      const snap = await this.ref.get();
      this.on = true;
      if (snap.exists) {
        const d = JSON.parse(JSON.stringify(snap.data()));
        if ((d.updatedAt || 0) > (S.updatedAt || 0)) { S = mergeState(d); persistLocal(); applyTheme(); App.refresh(); }
        else if ((S.updatedAt || 0) > (d.updatedAt || 0)) this.push();
      } else if (S.updatedAt) this.push();
    } catch (e) { this.ref = null; this.on = false; }
    App.updateSync();
  },
  push() {
    if (!this.ref) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.write(), 1200);
  },
  async write() {
    if (this.busy) { this.again = true; return; }
    this.busy = true;
    try { await this.ref.set(JSON.parse(JSON.stringify(S))); this.on = true; }
    catch (e) { if (e && e.code === "invalid_argument") { this.ref = null; this.on = false; } }
    this.busy = false;
    App.updateSync();
    if (this.again) { this.again = false; this.write(); }
  }
};

/* ================= Lặp lại ngắt quãng (SM-2 rút gọn) ================= */
function srsAdd(id) {
  if (!VOCAB_BY_ID[id]) return;
  if (!S.srs[id]) S.srs[id] = { ef: 2.5, iv: 0, reps: 0, lapses: 0, due: Date.now(), added: Date.now() };
}
function srsNext(c, q) {
  const n = { ...c }, now = Date.now();
  if (q < 3) { n.reps = 0; n.lapses = (n.lapses || 0) + 1; n.iv = 0; n.due = now + 10 * 60000; }
  else {
    n.reps++;
    if (n.reps === 1) n.iv = q === 5 ? 2 : 1;
    else if (n.reps === 2) n.iv = q === 5 ? 5 : q === 3 ? 2 : 3;
    else n.iv = Math.max(1, Math.round(n.iv * n.ef * (q === 5 ? 1.3 : q === 3 ? 0.8 : 1)));
    n.ef = Math.max(1.3, n.ef + 0.1 - (5 - q) * (0.08 + (5 - q) * 0.02));
    n.due = now + n.iv * DAY;
  }
  n.last = now;
  return n;
}
function srsGrade(id, q) { srsAdd(id); if (S.srs[id]) S.srs[id] = srsNext(S.srs[id], q); }
function srsPreview(id, q) {
  const c = S.srs[id] || { ef: 2.5, iv: 0, reps: 0, lapses: 0 };
  const n = srsNext(c, q);
  return n.iv === 0 ? "10 phút" : n.iv + " ngày";
}
const learnedIds = () => Object.keys(S.srs).filter(id => VOCAB_BY_ID[id]);
const dueIds = () => { const now = Date.now(); return learnedIds().filter(id => S.srs[id].due <= now); };
const weakIds = () => learnedIds().filter(id => S.srs[id].lapses >= 2 || S.srs[id].ef < 2.1).sort((a, b) => S.srs[b].lapses - S.srs[a].lapses);

/* ================= Phát âm (Web Speech API) ================= */
const TTS = { ok: "speechSynthesis" in window, voices: [], warned: false };
function loadVoices() {
  if (!TTS.ok) return;
  TTS.voices = speechSynthesis.getVoices().filter(v => /^(zh|cmn)/i.test(v.lang) || /chinese|中文|普通话|mandarin/i.test(v.name));
}
if (TTS.ok) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function zhVoice() {
  const vs = TTS.voices;
  return vs.find(v => v.name === S.settings.voice) || vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs[0] || null;
}
let speakToken = 0;
function speak(text, opts = {}) {
  if (!TTS.ok) { toast("Trình duyệt chưa hỗ trợ phát âm. Hãy dùng Chrome, Edge hoặc Safari."); return Promise.resolve(); }
  if (!TTS.voices.length) loadVoices();
  if (!TTS.voices.length && !TTS.warned) { TTS.warned = true; toast("Máy chưa có giọng đọc tiếng Trung. Xem hướng dẫn trong Cài đặt."); }
  const clean = String(text).replace(/[A-Z]：/g, "").replace(/HSK/g, "");
  const my = ++speakToken;
  speechSynthesis.cancel();
  return new Promise(res => {
    setTimeout(() => {
      if (my !== speakToken) return res();
      const u = new SpeechSynthesisUtterance(clean);
      u.lang = "zh-CN";
      const v = zhVoice(); if (v) u.voice = v;
      u.rate = opts.rate || S.settings.rate;
      u.onend = u.onerror = () => res();
      speechSynthesis.speak(u);
    }, 40);
  });
}
function stopSpeak() { speakToken++; if (TTS.ok) speechSynthesis.cancel(); }

/* Câu hỏi:
   { type: "mc", prompt, opts[], a, why, audio?, autoplay?, optInfo?[], word? }
   { type: "order", q, tokens[], py, why }
   { type: "type", prompt, check(value) -> {ok, msg}, why, answer } */
function runQuiz(el, qs, opts = {}) {
  let i = 0, score = 0, timerId = null, left = opts.timer || 0, done = false;
  const wrong = [];
  const total = qs.length;
  const keyHandlers = {};
  activeKeys = e => { const h = keyHandlers.fn; if (h) h(e); };

  function topBar() {
    return `<div class="quiz-top"><div class="bar"><i style="width:${(i / total) * 100}%"></i></div>
      ${opts.timer ? `<small class="timer" id="qtimer">${fmtTime(left)}</small>` : ""}<small>Câu ${Math.min(i + 1, total)}/${total}</small></div>`;
  }
  function fmtTime(s) { return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
  if (opts.timer) {
    timerId = setInterval(() => {
      left--;
      const t = $("#qtimer", el); if (t) t.textContent = fmtTime(Math.max(0, left));
      if (left <= 0) { clearInterval(timerId); toast("Hết giờ làm bài!"); for (let k = i; k < total; k++) wrong.push({ q: qs[k], chosen: null }); i = total; finish(); }
      if (!document.body.contains(el)) clearInterval(timerId);
    }, 1000);
  }

  function render() {
    if (i >= total) return finish();
    const q = qs[i];
    el.innerHTML = `<div class="quiz">${topBar()}<div class="q-body"></div></div>`;
    const body = $(".q-body", el);
    if (q.type === "order") renderOrder(body, q);
    else if (q.type === "type") renderType(body, q);
    else renderMC(body, q);
    if (q.audio && q.autoplay) setTimeout(() => speak(q.audio), 300);
  }

  function after(body, ok, q, detail) {
    if (ok) score++; else wrong.push({ q, detail });
    if (opts.onAnswer) opts.onAnswer(q, ok);
    const box = document.createElement("div");
    box.className = "explain " + (ok ? "ok" : "bad");
    box.innerHTML = `<h4>${ok ? "Chính xác!" : "Chưa đúng"}</h4>${detail || ""}<div>${q.why || ""}</div>`;
    body.appendChild(box);
    const row = document.createElement("div");
    row.className = "row"; row.style.marginTop = "14px";
    row.innerHTML = `<button class="btn primary" data-next>${i + 1 < total ? "Câu tiếp theo" : "Xem kết quả"}</button><span class="muted small">Nhấn <span class="kbd">Enter</span> để tiếp tục</span>`;
    body.appendChild(row);
    const next = () => { i++; render(); };
    $("[data-next]", row).onclick = next;
    $("[data-next]", row).focus({ preventScroll: true });
    keyHandlers.fn = e => { if (e.key === "Enter") { e.preventDefault(); next(); } };
  }

  function renderMC(body, q) {
    body.innerHTML = `<div class="q-prompt">${q.prompt || ""}${q.audio ? `<div class="row" style="margin-top:8px">${sayBtn(q.audio, "lg")}${q.slowAudio !== false ? `<button class="btn sm ghost" data-slow>Nghe chậm</button>` : ""}</div>` : ""}</div>
      <div class="opts">${q.opts.map((o, k) => `<button class="opt" data-k="${k}"><span class="key">${k + 1}</span><span>${o}</span></button>`).join("")}</div>`;
    const slow = $("[data-slow]", body); if (slow) slow.onclick = () => speak(q.audio, { rate: 0.5 });
    const choose = k => {
      $$(".opt", body).forEach(b => b.disabled = true);
      const ok = k === q.a;
      $$(".opt", body)[q.a].classList.add("ok");
      if (!ok) $$(".opt", body)[k].classList.add("bad");
      let detail = "";
      if (!ok) detail += `<p>Đáp án đúng: <b>${q.opts[q.a]}</b></p>`;
      if (!ok && q.optInfo && q.optInfo[k]) detail += `<p class="small">${q.optInfo[k]}</p>`;
      after(body, ok, q, detail);
      if (q.sayAfter) speak(q.sayAfter);
    };
    $$(".opt", body).forEach(b => b.onclick = () => choose(+b.dataset.k));
    keyHandlers.fn = e => { const n = +e.key; if (n >= 1 && n <= q.opts.length) choose(n - 1); };
  }

  function renderOrder(body, q) {
    let toks = shuffle(q.tokens.map((t, k) => ({ t, k })));
    if (toks.map(x => x.t).join("") === q.tokens.join("") && q.tokens.length > 1) toks = [...toks.slice(1), toks[0]];
    const picked = [];
    body.innerHTML = `<div class="q-prompt"><span class="muted">Sắp xếp thành câu đúng:</span><span class="mid">${esc(q.q)}</span></div>
      <div class="order-ans" aria-label="Câu của bạn"></div><div class="order-bank"></div>
      <div class="row" style="margin-top:14px"><button class="btn primary" data-check>Kiểm tra</button><button class="btn ghost" data-clear>Làm lại</button></div>`;
    const ans = $(".order-ans", body), bank = $(".order-bank", body);
    function draw() {
      ans.innerHTML = picked.map((x, n) => `<button class="tok" data-n="${n}">${esc(x.t)}</button>`).join("") || `<span class="muted small" style="padding:8px">Chạm vào các từ bên dưới theo đúng thứ tự</span>`;
      bank.innerHTML = toks.map((x, n) => `<button class="tok ${picked.includes(x) ? "used" : ""}" data-b="${n}">${esc(x.t)}</button>`).join("");
      $$("[data-b]", bank).forEach(b => b.onclick = () => { const x = toks[+b.dataset.b]; if (!picked.includes(x)) { picked.push(x); draw(); } });
      $$("[data-n]", ans).forEach(b => b.onclick = () => { picked.splice(+b.dataset.n, 1); draw(); });
    }
    draw();
    $("[data-clear]", body).onclick = () => { picked.length = 0; draw(); };
    $("[data-check]", body).onclick = () => {
      if (picked.length < toks.length) { toast("Hãy dùng hết các từ."); return; }
      const mine = picked.map(x => x.t).join(""), right = q.tokens.join("");
      const ok = mine === right;
      $$("button", body).forEach(b => b.disabled = true);
      const detail = `<p>Câu đúng: <span class="han" style="font-size:20px">${esc(right)}</span> ${sayBtn(right)}</p><p class="py">${colorPy(q.py)}</p>${ok ? "" : `<p class="small">Câu của bạn: <span class="han">${esc(mine)}</span></p>`}`;
      after(body, ok, q, detail);
      speak(right);
    };
    keyHandlers.fn = null;
  }

  function renderType(body, q) {
    body.innerHTML = `<div class="q-prompt">${q.prompt}</div>
      <div class="row"><input class="input" style="max-width:360px" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(q.placeholder || "Nhập câu trả lời")}"><button class="btn primary" data-check>Kiểm tra</button></div>`;
    const inp = $("input", body);
    setTimeout(() => inp.focus(), 50);
    const check = () => {
      if (!inp.value.trim()) return;
      const r = q.check(inp.value);
      inp.disabled = true; $("[data-check]", body).disabled = true;
      after(body, r.ok, q, `<p>${r.msg || ""}</p>`);
      if (q.sayAfter) speak(q.sayAfter);
    };
    $("[data-check]", body).onclick = check;
    inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); check(); } };
    keyHandlers.fn = null;
  }

  function finish() {
    if (done) return; done = true;
    clearInterval(timerId);
    activeKeys = null;
    const pct = total ? Math.round((score / total) * 100) : 0;
    const stars = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 50 ? 1 : 0;
    const extra = opts.onFinish ? (opts.onFinish({ score, total, pct, wrong }) || "") : "";
    const msg = pct >= 90 ? "Xuất sắc! Bạn nắm rất chắc phần này." : pct >= 70 ? "Tốt lắm! Xem lại vài câu sai bên dưới nhé." : pct >= 50 ? "Khá ổn. Đọc kỹ phần giải thích rồi làm lại để nhớ lâu hơn." : "Đừng nản! Xem lại bài học và giải thích, rồi thử lại.";
    el.innerHTML = `<div class="quiz"><div class="result">
      <div class="score">${score}/${total}</div>
      <div class="stars" aria-label="${stars} sao">${"★".repeat(stars)}${"☆".repeat(3 - stars)}</div>
      <p class="lead" style="margin:0 auto 10px">${msg}</p>${extra}
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn" data-retry>Làm lại</button>${opts.finishButtons || ""}</div></div>
      ${wrong.length ? `<div class="wrong-list"><h3>Xem lại câu sai (${wrong.length})</h3>${wrong.map(w => `<div class="explain bad" style="margin-top:10px">
        <h4>${w.q.type === "order" ? esc(w.q.q) : (w.q.reviewTitle || stripHtml(w.q.prompt || "").slice(0, 120) || "Câu hỏi")}</h4>
        ${w.q.type === "mc" ? `<p>Đáp án đúng: <b>${w.q.opts[w.q.a]}</b></p>` : w.q.type === "order" ? `<p>Đáp án: <span class="han">${esc(w.q.tokens.join(""))}</span></p>` : w.q.answer ? `<p>Đáp án: <b>${w.q.answer}</b></p>` : ""}
        <div>${w.q.why || ""}</div></div>`).join("")}</div>` : ""}</div>`;
    $("[data-retry]", el).onclick = () => runQuiz(el, opts.reshuffle ? opts.reshuffle() : qs, opts);
    if (opts.afterFinish) opts.afterFinish(el);
  }
  render();
}
const stripHtml = s => { const d = document.createElement("div"); d.innerHTML = s; return d.textContent.trim(); };

/* ================= Sinh câu hỏi từ vựng ================= */
function distract(w, field, n = 3) {
  const seen = new Set([w[field]]);
  const same = shuffle(VOCAB.filter(x => x.topic === w.topic && x.id !== w.id));
  const other = shuffle(VOCAB.filter(x => x.topic !== w.topic));
  const out = [];
  for (const x of [...same, ...other]) { if (out.length >= n) break; if (!seen.has(x[field])) { seen.add(x[field]); out.push(x); } }
  return out;
}
function wordWhy(w) {
  return `<p><span class="han" style="font-size:22px">${esc(w.hz)}</span> <span class="py">${colorPy(w.py)}</span> = <b>${esc(w.vi)}</b> · Hán Việt: <i>${esc(w.hv)}</i></p>
  <p class="small">Ví dụ: <span class="han">${esc(w.ex.zh)}</span> ${sayBtn(w.ex.zh)}<br><span class="py">${colorPy(w.ex.py)}</span><br>${esc(w.ex.vi)}</p>`;
}
const pyIf = py => S.settings.showPy ? `<span class="py" style="display:block;font-size:18px">${colorPy(py)}</span>` : "";
function qMeaning(w) {
  const o = shuffle([w, ...distract(w, "vi")]);
  return { type: "mc", word: w.id, prompt: `<span class="muted">Từ này nghĩa là gì?</span><span class="big">${esc(w.hz)}</span>${pyIf(w.py)}`, audio: w.hz, autoplay: false, reviewTitle: w.hz,
    opts: o.map(x => esc(x.vi)), a: o.indexOf(w), why: wordWhy(w),
    optInfo: o.map(x => x === w ? "" : `Bạn chọn “${esc(x.vi)}” – đó là nghĩa của <span class="han">${esc(x.hz)}</span> (${colorPy(x.py)}).`) };
}
function qHanzi(w) {
  const o = shuffle([w, ...distract(w, "hz")]);
  return { type: "mc", word: w.id, prompt: `<span class="muted">Chọn chữ Hán có nghĩa:</span><span class="mid">${esc(w.vi)}</span>`, reviewTitle: w.vi,
    opts: o.map(x => `<span class="han">${esc(x.hz)}</span>`), a: o.indexOf(w), why: wordWhy(w), sayAfter: w.hz,
    optInfo: o.map(x => x === w ? "" : `<span class="han">${esc(x.hz)}</span> (${colorPy(x.py)}) nghĩa là “${esc(x.vi)}”.`) };
}
function qListen(w) {
  const o = shuffle([w, ...distract(w, "hz")]);
  return { type: "mc", word: w.id, prompt: `<span class="muted">Nghe và chọn từ bạn nghe được</span>`, audio: w.hz, autoplay: true, reviewTitle: "Nghe: " + w.hz,
    opts: o.map(x => `<span class="han">${esc(x.hz)}</span>`), a: o.indexOf(w), why: wordWhy(w),
    optInfo: o.map(x => x === w ? "" : `<span class="han">${esc(x.hz)}</span> đọc là ${colorPy(x.py)} – hãy nghe lại để so sánh với ${colorPy(w.py)}.`) };
}
function qPinyin(w) {
  const set = new Set([w.py]); let guard = 0;
  while (set.size < 4 && guard++ < 40) set.add(retone(w.py));
  const o = shuffle([...set]);
  return { type: "mc", word: w.id, prompt: `<span class="muted">Chọn cách đọc (Pinyin) đúng</span><span class="big">${esc(w.hz)}</span>`, reviewTitle: w.hz,
    opts: o.map(p => `<span class="py">${colorPy(p)}</span>`), a: o.indexOf(w.py), sayAfter: w.hz,
    why: `<p>Thanh điệu từng âm tiết: ${toneDesc(w.py)}.</p>` + wordWhy(w) };
}
function qSentence(w) {
  const o = shuffle([w, ...distract(w, "vi")]);
  return { type: "mc", word: w.id, prompt: `<span class="muted">Nghe câu và chọn nghĩa đúng</span>`, audio: w.ex.zh, autoplay: true, reviewTitle: w.ex.zh,
    opts: o.map(x => esc(x.ex.vi)), a: o.indexOf(w),
    why: `<p><span class="han" style="font-size:20px">${esc(w.ex.zh)}</span> ${sayBtn(w.ex.zh)}</p><p class="py">${colorPy(w.ex.py)}</p><p>${esc(w.ex.vi)}</p><p class="small">Từ khóa: <span class="han">${esc(w.hz)}</span> ${colorPy(w.py)} = ${esc(w.vi)}</p>` };
}
const Q_TYPES = [qMeaning, qHanzi, qListen, qPinyin];
function mixedWordQs(words, n) {
  return pick(words, Math.min(n, words.length)).map((w, k) => Q_TYPES[(k + Math.floor(Math.random() * 4)) % 4](w));
}
const mcFrom = (x, prefix = "") => ({ type: "mc", prompt: `<span class="mid" style="font-size:20px">${prefix}${esc(x.q)}</span>`, reviewTitle: x.q, opts: x.opts.map(o => /[\u4e00-\u9fff]/.test(o) ? `<span class="han">${esc(o)}</span>` : esc(o)), a: x.a, why: `<p>${esc(x.why)}</p>` });
const grammarQs = g => g.ex.map(x => x.type === "order" ? { ...x } : mcFrom(x));

/* ===== Câu hỏi phát âm ===== */
function qTone(set, idx) {
  const py = applyTone(set.base, idx + 1);
  return { type: "mc", prompt: `<span class="muted">Nghe và chọn thanh điệu đúng</span>`, audio: set.hz[idx], autoplay: true, reviewTitle: "Nghe: " + set.hz[idx],
    opts: [1, 2, 3, 4].map(t => `<span class="py t${t}" style="font-size:20px">${applyTone(set.base, t)}</span> · Thanh ${t}`), a: idx,
    why: `<p><span class="han" style="font-size:22px">${set.hz[idx]}</span> đọc là <span class="py t${idx + 1}">${py}</span> (thanh ${idx + 1}), nghĩa “${esc(set.vi[idx])}”.</p><p class="small">${TONES[idx].vn}</p><p class="small">Cả bộ: ${set.hz.map((h, k) => `<span class="han">${h}</span> <span class="t${k + 1}">${applyTone(set.base, k + 1)}</span>`).join(" · ")}</p>` };
}
function qInitial(it) {
  const groups = CONFUSABLE.filter(g => g.includes(it.k));
  let opts = groups.length ? [...groups[Math.floor(Math.random() * groups.length)]] : [it.k, ...pick(INITIALS.filter(x => x.k !== it.k), 3).map(x => x.k)];
  opts = shuffle(opts);
  return { type: "mc", prompt: `<span class="muted">Nghe và chọn phụ âm đầu đúng</span>`, audio: it.hz, autoplay: true, reviewTitle: "Nghe: " + it.hz,
    opts: opts.map(k => `<b style="font-size:20px">${k}</b>`), a: opts.indexOf(it.k),
    why: `<p><span class="han" style="font-size:22px">${it.hz}</span> <span class="py">${colorPy(it.py)}</span> – phụ âm đầu <b>${it.k}</b>.</p><p class="small">${esc(it.hint)}</p>` };
}
function qFinal(it) {
  const opts = shuffle([it, ...pick(FINALS.filter(x => x.k !== it.k), 3)]);
  return { type: "mc", prompt: `<span class="muted">Nghe và chọn vần đúng</span>`, audio: it.hz, autoplay: true, reviewTitle: "Nghe: " + it.hz,
    opts: opts.map(x => `<b style="font-size:20px">${x.k}</b>`), a: opts.indexOf(it),
    why: `<p><span class="han" style="font-size:22px">${it.hz}</span> <span class="py">${colorPy(it.py)}</span> – vần <b>${it.k}</b>, gần với “${esc(it.vn)}” trong tiếng Việt.</p><p class="small">${esc(it.hint)}</p>` };
}

function fmtWhen(t) {
  const d = new Date(t), now = new Date();
  const hm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  if (dayKey(d) === dayKey(now)) return "Hôm nay " + hm;
  if (dayKey(d) === dayKey(new Date(Date.now() - DAY))) return "Hôm qua " + hm;
  return d.getDate() + "/" + (d.getMonth() + 1) + " " + hm;
}

  const d = c.length === 2 ? `M${pts[0]} L${pts[1]}` : `M${pts[0]} Q${pts[1][0]},${y(c[1]) + 22} ${pts[2]}`;
  return `<svg viewBox="0 0 200 95" aria-hidden="true">${[1, 2, 3, 4, 5].map(l => `<line x1="20" x2="180" y1="${y(l)}" y2="${y(l)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="4" y="${y(l) + 4}" font-size="10" fill="var(--muted)">${l}</text>`).join("")}
  <path d="${d}" stroke="${color}" stroke-width="6" fill="none" stroke-linecap="round"/></svg>`;
}

function lessonQuestions(l) {
  let qs = [];
  for (const p of l.parts) {
    if (p.k === "intro") qs.push(...INTRO_QS.map(x => mcFrom(x)));
    if (p.k === "initials") qs.push(...pick(INITIALS.filter(x => CONFUSABLE.flat().includes(x.k)), 7).map(qInitial));
    if (p.k === "finals") qs.push(...pick(FINALS, 6).map(qFinal));
    if (p.k === "tones") qs.push(...pick(TONE_SETS, 8).map(s => qTone(s, Math.floor(Math.random() * 4))));
    if (p.k === "sandhi") qs.push(...SANDHI_QS.map(x => mcFrom(x)));
    if (p.k === "strokes") qs.push(...STROKE_QS.map(x => mcFrom(x)));
    if (p.k === "vocab") qs.push(...mixedWordQs(VOCAB.filter(w => w.topic === p.t), 6));
    if (p.k === "grammar") qs.push(...grammarQs(GRAMMAR_BY_ID[p.g]));

    if (p.k === "review") {
      const pool = learnedIds().length >= 8 ? learnedIds().map(id => VOCAB_BY_ID[id]) : VOCAB.filter(w => w.lv <= 2);

    }

function qTypePinyin(w) {
  return { type: "type", word: w.id, reviewTitle: w.hz, prompt: `<span class="muted">Gõ Pinyin kèm số thanh (ví dụ: ni3 hao3). Thanh nhẹ không cần số, ü gõ là v.</span><span class="big">${esc(w.hz)}</span><span class="muted">${esc(w.vi)}</span>`,
    placeholder: "ví dụ: ni3 hao3", answer: `${colorPy(w.py)} (${toNumbered(w.py).replace(/(\d)/g, "$1 ").trim()})`, sayAfter: w.hz,
    check: v => {
      const raw = normalizePyInput(v).replace(/\s+/g, "");
      const marked = normalizePyInput(w.py).replace(/\s+/g, "");
      const num = toNumbered(w.py).replace(/ü/g, "u");
      const plain = stripTones(w.py).replace(/[^a-z]/g, "");
      const hasDigit = /\d/.test(raw);
      const rawPlain = stripTones(raw).replace(/[^a-z]/g, "");
      if (raw === marked || raw.replace(/[^a-z0-9]/g, "") === num.replace(/[^a-z0-9]/g, "")) return { ok: true, msg: `Đáp án: ${colorPy(w.py)}` };
      if (rawPlain === plain) return { ok: false, msg: `Đúng âm nhưng ${hasDigit ? "sai" : "thiếu"} thanh điệu. Đáp án: ${colorPy(w.py)} – ${toneDesc(w.py)}.` };
      return { ok: false, msg: `Đáp án: ${colorPy(w.py)} (${toNumbered(w.py)})` };
    },
    why: wordWhy(w) };
}
function lcs(a, b) {
  const m = a.length, n = b.length, dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
  const hit = new Set(); let i = m, j = n;
  while (i && j) { if (a[i - 1] === b[j - 1]) { hit.add(i - 1); i--; j--; } else if (dp[i - 1][j] >= dp[i][j - 1]) i--; else j--; }
  return { len: dp[m][n], hit };
}
function mountSpeak(c) {

      };

        $("#sp-res", c).innerHTML = `<p class="small" style="text-align:center">${msg}</p>${e.error === "no-speech" ? "" : selfRate()}`; bindSelf();
      };
      rec.start();
    } catch (err) { $("#sp-res", c).innerHTML = selfRate(); bindSelf(); }
  };
  draw();
}

function viewFlashcards(el, deck) {

  ids = shuffle(ids);
  let mode = "zh", i = 0, flipped = false, seen = 0;
  el.innerHTML = `<div class="page-head"><h1>Flashcard</h1><p>Lật thẻ, tự nhớ rồi đánh giá mức độ. Hệ thống sẽ tự tính ngày ôn lại tối ưu cho từng từ.</p></div>
    <div class="row" style="margin-bottom:12px"><select class="input" id="fc-deck" style="max-width:280px">${decks.map(([k, n]) => `<option value="${k}" ${k === deck ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>
    <select class="input" id="fc-mode" style="max-width:220px"><option value="zh">Chữ Hán → Nghĩa</option><option value="vi">Nghĩa → Chữ Hán</option><option value="au">Nghe → Chữ Hán</option></select></div><div id="fc"></div>`;
  $("#fc-deck", el).onchange = e => location.hash = "#/flashcards/" + e.target.value;
  $("#fc-mode", el).onchange = e => { mode = e.target.value; draw(); };
  const box = $("#fc", el);
  function draw() {
    if (!ids.length) {
      box.innerHTML = `<div class="empty"><span class="han">卡</span>${deck === "due" ? "Không có từ nào đến hạn ôn. Tuyệt vời!" : "Bộ thẻ này chưa có từ nào."}<div class="row" style="justify-content:center;margin-top:12px"><a class="btn primary" href="#/flashcards/${TOPICS[0].id}">Học từ mới</a></div></div>`; activeKeys = null; return;
    }
    if (i >= ids.length) {
      box.innerHTML = `<div class="quiz result"><div class="score">${seen}</div><p class="lead">thẻ đã ôn xong. Hẹn gặp lại theo lịch ôn tập!</p><div class="row" style="justify-content:center"><a class="btn primary" href="#/review">Làm bài ôn tập</a><button class="btn" id="fc-again">Học lại bộ này</button></div></div>`;
      $("#fc-again", box).onclick = () => { i = 0; ids = shuffle(ids); draw(); };
      if (seen) addXP(Math.min(30, seen * 2), `Ôn ${seen} flashcard`, "flashcard");
      activeKeys = null; return;
    }
    const w = VOCAB_BY_ID[ids[i]]; flipped = false;
    const front = mode === "zh" ? `${tzg(w.hz)}` : mode === "vi" ? `<div class="mean" style="font-size:28px">${esc(w.vi)}</div>` : `${sayBtn(w.hz, "lg")}<div class="muted">Nghe và nhớ lại từ</div>`;
    box.innerHTML = `<p class="muted small" style="text-align:center">Thẻ ${i + 1}/${ids.length}${S.srs[w.id] ? "" : " · từ mới"}</p>
      <div class="fc-wrap"><div class="fc" id="card" tabindex="0" aria-label="Thẻ ghi nhớ, nhấn để lật">
        <div class="fc-face">${front}<span class="hint">Nhấn thẻ hoặc phím cách để lật</span></div>
        <div class="fc-face fc-back">${tzg(w.hz)}<div class="py">${colorPy(w.py)}</div><div class="mean">${esc(w.vi)}</div><div class="small muted">Hán Việt: ${esc(w.hv)}</div>
          <div class="small" style="margin-top:6px"><span class="han">${esc(w.ex.zh)}</span><br>${esc(w.ex.vi)}</div></div></div></div>
      <div class="fc-rate" id="rate" style="visibility:hidden">
        ${[["r1", "Quên", 1], ["r2", "Khó", 3], ["r3", "Nhớ", 4], ["r4", "Dễ", 5]].map(([c, n, q], k) => `<button class="btn ${c}" data-q="${q}">${k + 1}. ${n}<small>${srsPreview(w.id, q)}</small></button>`).join("")}</div>`;
    if (mode === "au") setTimeout(() => speak(w.hz), 250);
    const card = $("#card", box);
    const flip = () => { flipped = !flipped; card.classList.toggle("flip", flipped); if (flipped) { $("#rate", box).style.visibility = "visible"; speak(w.hz); } };
    card.onclick = flip;
    const rate = q => { if (!flipped) return; srsGrade(w.id, q); save(); seen++; if (q < 3) ids.push(w.id); i++; draw(); };
    $$("[data-q]", box).forEach(b => b.onclick = e => { e.stopPropagation(); rate(+b.dataset.q); });
    activeKeys = e => { if (e.key === " ") { e.preventDefault(); flip(); } const n = +e.key; if (n >= 1 && n <= 4) rate([1, 3, 4, 5][n - 1]); };
  }
  draw();
}

/* ================= Ôn tập thông minh ================= */
function viewReview(el) {
  const due = dueIds(), weak = weakIds(), learned = learnedIds(), mastered = masteredIds();
  const now = Date.now();
  const days = [...Array(7)].map((_, k) => { const end = new Date(); end.setHours(23, 59, 59, 999); const e = end.getTime() + k * DAY; const s = k === 0 ? 0 : e - DAY; return { k, n: learned.filter(id => S.srs[id].due > s && S.srs[id].due <= e).length }; });
  const mx = Math.max(1, ...days.map(d => d.n));
  el.innerHTML = `<div class="page-head"><h1>Ôn tập thông minh</h1><p>Hệ thống lặp lại ngắt quãng nhắc bạn ôn mỗi từ đúng lúc sắp quên: từ dễ giãn lịch ra vài tuần, từ hay sai được ôn lại sớm hơn.</p></div>
    <div class="grid g4"><div class="panel stat"><b>${due.length}</b><span>đến hạn hôm nay</span></div><div class="panel stat"><b>${learned.length}</b><span>từ trong lịch ôn</span></div>
      <div class="panel stat"><b>${mastered.length}</b><span>từ đã thuộc lâu</span></div><div class="panel stat"><b>${weak.length}</b><span>từ hay nhầm</span></div></div>
    <div class="panel sec" style="margin-top:16px"><div class="row between"><h3 style="margin:0">Bắt đầu ôn</h3></div>
      <p class="muted small">Mỗi từ được hỏi theo một dạng khác nhau (nghĩa, chữ Hán, nghe, Pinyin). Trả lời đúng sẽ giãn lịch, sai sẽ được hỏi lại sớm.</p>
      <div class="row">${due.length ? `<button class="btn primary" data-r="due">Ôn ${Math.min(due.length, 15)} từ đến hạn</button>` : ""}
        ${weak.length ? `<button class="btn" data-r="weak">Luyện ${Math.min(weak.length, 10)} từ hay nhầm</button>` : ""}
        ${learned.length >= 4 ? `<button class="btn ${due.length ? "" : "primary"}" data-r="any">Ôn ngẫu nhiên 10 từ</button>` : ""}
        <a class="btn ghost" href="#/flashcards">Dùng flashcard</a></div>
      ${!learned.length ? `<div class="empty"><span class="han">复</span>Chưa có từ nào trong lịch ôn. Học một bài trong lộ trình hoặc thêm từ ở mục Từ vựng.<div style="margin-top:10px"><a class="btn primary" href="#/vocab">Đến mục Từ vựng</a></div></div>` : ""}
      <div id="rv" class="sec"></div></div>
    <div class="grid g2 sec" style="margin-top:16px">
      <div class="panel"><h3>Lịch ôn 7 ngày tới</h3><div class="week">${days.map(d => `<div class="d"><span class="v">${d.n || ""}</span><div class="col ${d.k === 0 ? "today" : ""}" style="height:${Math.round((d.n / mx) * 90)}px"></div><small>${d.k === 0 ? "Nay" : "+" + d.k}</small></div>`).join("")}</div></div>
      <div class="panel"><h3>Từ hay nhầm</h3>${weak.length ? weak.slice(0, 8).map(id => { const w = VOCAB_BY_ID[id]; return `<div class="row" style="padding:6px 0;border-bottom:1px dashed var(--line)">${sayBtn(w.hz)}<span class="han" style="font-size:20px">${esc(w.hz)}</span><span class="py">${colorPy(w.py)}</span><span class="muted small">${esc(w.vi)}</span><span class="small" style="margin-left:auto;color:var(--bad)">sai ${S.srs[id].lapses} lần</span></div>`; }).join("") : `<p class="muted">Chưa có từ nào. Những từ bạn trả lời sai từ 2 lần sẽ xuất hiện ở đây.</p>`}</div></div>`;
  $$("[data-r]", el).forEach(b => b.onclick = () => {
    const src = b.dataset.r === "due" ? due.slice(0, 15) : b.dataset.r === "weak" ? weak.slice(0, 10) : pick(learned, 10);
    const make = () => shuffle(src).map((id, k) => Q_TYPES[(k + Math.floor(Math.random() * 4)) % 4](VOCAB_BY_ID[id]));
    runQuiz($("#rv", el), make(), {
      onAnswer: (q, ok) => { if (!q.word) return; const c = S.srs[q.word]; if (!ok) srsGrade(q.word, 1); else if (c && c.due <= now) srsGrade(q.word, 4); save(); },
      onFinish: ({ score, total }) => { addXP(Math.max(5, score * 2), `Ôn tập ${total} từ`, "review"); },
      finishButtons: `<a class="btn primary" href="#/review">Cập nhật thống kê</a>`
    });
    $("#rv", el).scrollIntoView({ behavior: "smooth" });
  });
}

/* ================= Kiểm tra & HSK ================= */
function viewTest(el, tab = "placement") {
  const tabs = [["placement", "Kiểm tra trình độ"], ["hsk1", "Thi thử HSK 1"], ["hsk2", "Thi thử HSK 2"], ["results", "Kết quả"]];
  el.innerHTML = `<div class="page-head"><h1>Kiểm tra & luyện thi HSK</h1><p>HSK (汉语水平考试) là kỳ thi năng lực tiếng Trung quốc tế. Đề thi thử ở đây mô phỏng hai phần Nghe và Đọc, có bấm giờ và quy đổi điểm.</p></div>
    <div class="tabs">${tabs.map(([k, n]) => `<button class="${k === tab ? "on" : ""}" data-go="#/test/${k}">${n}</button>`).join("")}</div><div id="tc"></div>`;
  const c = $("#tc", el);
  if (tab === "placement") {
    c.innerHTML = `<div class="panel"><h3>Bài kiểm tra trình độ đầu vào</h3><p>12 câu, độ khó tăng dần từ phát âm đến câu phức. Không tính giờ. Kết quả dùng để chọn điểm bắt đầu phù hợp trong lộ trình.</p>
      ${S.tests.placement ? `<p class="muted small">Lần trước: ${S.tests.placement.score}/12 (${fmtWhen(S.tests.placement.at)})</p>` : ""}<button class="btn primary" id="pt">Bắt đầu kiểm tra</button></div><div id="tq" class="sec"></div>`;
    $("#pt", c).onclick = () => runQuiz($("#tq", c), PLACEMENT.map(x => mcFrom(x)), {
      onFinish: ({ score }) => {
        const [lv, start, label] = score <= 3 ? ["zero", "L1", "Giai đoạn 1 – Nền tảng phát âm"] : score <= 6 ? ["pinyin", "L7", "Giai đoạn 2 – HSK 1"] : score <= 9 ? ["basic", "L13", "Giai đoạn 3 – HSK 2"] : ["basic", "L18", "Giai đoạn 4 – HSK 3"];
        S.profile.level = lv; S.profile.start = start; S.profile.onboarded = true;
        S.tests.placement = { score, at: Date.now() };
        addXP(10, "Kiểm tra trình độ: " + score + "/12", "test");
        return `<div class="note" style="text-align:left"><b>Gợi ý của hệ thống.</b> Bạn nên bắt đầu từ <b>${label}</b>, bài ${start.slice(1)}. Lộ trình đã được cập nhật. Bạn vẫn có thể học lại các bài trước bất cứ lúc nào.</div>`;
      },
      finishButtons: `<a class="btn primary" href="#/path">Xem lộ trình của bạn</a>`
    });
  } else if (tab === "hsk1" || tab === "hsk2") {
    const lv = tab === "hsk1" ? 1 : 2;
    c.innerHTML = `<div class="panel"><h3>Đề thi thử HSK ${lv}</h3>
      <p>Gồm 20 câu: <b>Phần Nghe</b> (10 câu – nghe từ và câu, chọn đáp án) và <b>Phần Đọc</b> (10 câu – điền từ, chọn câu trả lời phù hợp). Thời gian 20 phút. Điểm được quy đổi theo thang 200 của kỳ thi thật, đạt từ 120 điểm.</p>
      <div class="note"><b>Mẹo làm bài.</b> Ở phần nghe, mỗi câu có thể nghe lại bằng nút loa. Trong kỳ thi thật mỗi câu chỉ được nghe 2 lần, hãy luyện thói quen tập trung ngay lần đầu.</div>
      <button class="btn primary" id="hs">Bắt đầu làm bài</button></div><div id="tq" class="sec"></div>`;
    const make = () => {
      const pool = VOCAB.filter(w => w.lv <= lv);
      return [...pick(pool, 5).map(qListen), ...pick(pool, 5).map(qSentence), ...pick(HSK_ITEMS[lv], 10).map(x => mcFrom(x))];
    };
    $("#hs", c).onclick = () => { $("#hs", c).closest(".panel").hidden = true; runQuiz($("#tq", c), make(), { timer: 20 * 60,
      onFinish: ({ score, total }) => {
        const pts = Math.round((score / total) * 200), pass = pts >= 120;
        S.tests[tab] = [{ score, total, pts, at: Date.now() }, ...(S.tests[tab] || [])].slice(0, 10);
        addXP(25, `Thi thử HSK ${lv}: ${pts}/200`, "test");
        return `<div class="note" style="text-align:left"><b>Điểm quy đổi: ${pts}/200 – ${pass ? "ĐẠT" : "CHƯA ĐẠT"}.</b> ${pass ? `Bạn đã sẵn sàng cho HSK ${lv}. Hãy thử ${lv === 1 ? "đề HSK 2" : "học tiếp Giai đoạn 4"}.` : `Cần 120 điểm để đạt. Ôn lại từ vựng HSK ${lv} và các bài ngữ pháp, sau đó thi lại.`}</div>`;
      } }); };
  } else {
    const rows = [["Kiểm tra trình độ", S.tests.placement ? [{ pts: S.tests.placement.score + "/12", at: S.tests.placement.at }] : []], ["HSK 1", (S.tests.hsk1 || []).map(x => ({ pts: x.pts + "/200", at: x.at }))], ["HSK 2", (S.tests.hsk2 || []).map(x => ({ pts: x.pts + "/200", at: x.at }))]];
    const all = rows.flatMap(([n, l]) => l.map(x => ({ n, ...x }))).sort((a, b) => b.at - a.at);
    c.innerHTML = all.length ? `<div class="panel scroll-x"><table class="table"><thead><tr><th>Bài</th><th>Điểm</th><th>Thời gian</th></tr></thead><tbody>${all.map(x => `<tr><td>${x.n}</td><td><b>${x.pts}</b></td><td class="muted">${fmtWhen(x.at)}</td></tr>`).join("")}</tbody></table></div>`
      : `<div class="empty"><span class="han">考</span>Chưa có kết quả nào. Hãy làm bài kiểm tra trình độ hoặc thi thử HSK.</div>`;
  }
}

/* ================= Tra từ ================= */
function viewSearch(el, q0 = "") {
  el.innerHTML = `<div class="page-head"><h1>Tra từ</h1><p>Tìm bằng chữ Hán, Pinyin (có hoặc không dấu), nghĩa tiếng Việt (có hoặc không dấu) hoặc âm Hán Việt.</p></div>
    <input class="input search-big" id="sq" type="search" placeholder="Ví dụ: 你好, nihao, cảm ơn, hoc sinh" value="${esc(decodeURIComponent(q0))}" autocomplete="off"><div id="sr" class="sec"></div>`;
  const inp = $("#sq", el), out = $("#sr", el);
  const run = () => {
    const raw = inp.value.trim();
    if (!raw) { out.innerHTML = `<p class="muted">Gợi ý tìm: ${["谢谢", "xuexi", "đắt", "bang huu", "ăn"].map(s => `<button class="btn sm ghost" data-s="${s}">${s}</button>`).join("")}</p>`; $$("[data-s]", out).forEach(b => b.onclick = () => { inp.value = b.dataset.s; run(); }); return; }
    const q = plainVi(raw), qpy = stripTones(raw).replace(/[\s\d]/g, "");
    const res = VOCAB.filter(w => w.hz.includes(raw) || (qpy && stripTones(w.py).replace(/\s/g, "").includes(qpy)) || plainVi(w.vi).includes(q) || plainVi(w.hv).includes(q) || w.ex.zh.includes(raw))
      .sort((a, b) => (b.hz === raw) - (a.hz === raw) || a.hz.length - b.hz.length);
    const gr = GRAMMAR.filter(g => g.formula.includes(raw) || plainVi(g.title).includes(q));
    out.innerHTML = `<p class="muted small">${res.length} từ${gr.length ? `, ${gr.length} điểm ngữ pháp` : ""}</p>
      ${gr.length ? `<div class="grid auto" style="margin-bottom:14px">${gr.map(g => `<a class="topic" href="#/grammar/${g.id}"><div><b>${esc(g.title)}</b><span class="m han">${esc(g.formula)}</span></div></a>`).join("")}</div>` : ""}
      ${res.length ? `<div class="words">${res.slice(0, 40).map(wordCard).join("")}</div>` : `<div class="empty"><span class="han">查</span>Không tìm thấy từ nào. Thử gõ nghĩa tiếng Việt khác hoặc Pinyin không dấu.</div>`}`;
    bindLearn(out);
  };
  let t; inp.oninput = () => { clearTimeout(t); t = setTimeout(run, 150); };
  run(); setTimeout(() => inp.focus(), 50);
}

  });
}

/* ---- js/main.js ---- */
/* ================= Khung ứng dụng & điều hướng ================= */
const NAV = [
  ["Học", [["#/", "首", "Tổng quan"], ["#/path", "路", "Lộ trình học"]]],
  ["Kiến thức", [["#/pinyin", "拼", "Pinyin & thanh điệu"], ["#/vocab", "词", "Từ vựng"], ["#/grammar", "法", "Ngữ pháp"], ["#/hanzi", "字", "Chữ Hán"], ["#/dialogues", "话", "Hội thoại"]]],
  ["Luyện tập", [["#/practice", "练", "Nghe, nói, đọc, viết"], ["#/flashcards", "卡", "Flashcard"], ["#/review", "复", "Ôn tập thông minh"], ["#/test", "考", "Kiểm tra & HSK"]]],
  ["Công cụ", [["#/search", "查", "Tra từ"], ["#/settings", "设", "Cài đặt"]]]
];
const ROUTES = [
  [/^\/$/, viewHome], [/^\/path$/, viewPath], [/^\/lesson\/(\w+)$/, viewLesson],
  [/^\/pinyin(?:\/(\w+))?$/, viewPinyin], [/^\/vocab(?:\/(\w+))?$/, viewVocab], [/^\/grammar(?:\/(\w+))?$/, viewGrammar],
  [/^\/hanzi(?:\/(\w+))?(?:\/(.+))?$/, viewHanzi], [/^\/dialogues(?:\/(\w+))?$/, viewDialogues],
  [/^\/practice(?:\/(\w+))?$/, viewPractice], [/^\/flashcards(?:\/(\w+))?$/, viewFlashcards], [/^\/review$/, viewReview],
  [/^\/test(?:\/(\w+))?$/, viewTest], [/^\/search(?:\/(.*))?$/, viewSearch], [/^\/settings$/, viewSettings]
];

function applyTheme() {
  const t = S.settings.theme;
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}

const App = {
  init() {
    applyTheme();
    $("#side").innerHTML = `<a class="brand" href="#/"><span class="brand-seal">汉</span><span><b>Học Tiếng Trung</b><small>Từ con số 0 cho người Việt</small></span></a>
      ${NAV.map(([g, items]) => `<div class="nav-group">${g}</div><nav class="nav">${items.map(([h, ic, n]) => `<a href="${h}" data-nav="${h}"><span class="ic">${ic}</span>${n}</a>`).join("")}</nav>`).join("")}
      <div class="side-foot"><div id="sync"></div><div style="margin-top:4px">Âm thanh: giọng đọc của trình duyệt</div></div>`;
    $("#tabbar").innerHTML = [["#/", "首", "Tổng quan"], ["#/path", "路", "Lộ trình"], ["#/review", "复", "Ôn tập"], ["#/practice", "练", "Luyện tập"]]
      .map(([h, ic, n]) => `<a href="${h}" data-nav="${h}"><span class="ic">${ic}</span>${n}</a>`).join("") + `<button id="tab-more"><span class="ic">≡</span>Thêm</button>`;
    const openSide = () => { $("#side").classList.add("open"); const s = document.createElement("div"); s.className = "scrim"; s.id = "scrim"; s.onclick = closeSide; document.body.appendChild(s); };
    const closeSide = () => { $("#side").classList.remove("open"); $("#scrim")?.remove(); };
    this.closeSide = closeSide;
    $("#menu-btn").onclick = openSide; $("#tab-more").onclick = openSide;

    document.addEventListener("click", e => {
      const s = e.target.closest("[data-say]");
      if (s) { e.preventDefault(); e.stopPropagation(); s.classList.add("playing"); speak(s.dataset.say).then(() => s.classList.remove("playing")); return; }
      const g = e.target.closest("[data-go]");
      if (g) { location.hash = g.dataset.go; }
    }, true);
    window.addEventListener("hashchange", () => this.route());
    this.route();
    this.updateSync();
    const ready = Promise.race([Cloud.init(), new Promise(r => setTimeout(r, 2500))]);
    ready.then(() => onboarding());
  },
  route() {
    stopSpeak(); dlgRun++; activeKeys = null;
    const h = (location.hash.replace(/^#/, "") || "/");
    let hit = null;
    for (const [re, fn] of ROUTES) { const m = h.match(re); if (m) { hit = [fn, m.slice(1).filter(x => x !== undefined)]; break; } }
    if (!hit) { location.hash = "#/"; return; }
    const v = $("#view");
    try { hit[0](v, ...hit[1]); }
    catch (err) { console.error(err); v.innerHTML = `<div class="empty"><span class="han">错</span>Trang này gặp lỗi khi hiển thị. <a href="#/">Về trang tổng quan</a></div>`; }
    const base = "#/" + (h.split("/")[1] || "");
    $$("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === (base === "#/lesson" ? "#/path" : base)));
    this.closeSide?.();
    window.scrollTo(0, 0);
    document.title = (($("h1", v)?.textContent) || "Tổng quan") + " – Học Tiếng Trung";
  },
  refresh() { const y = window.scrollY; this.route(); window.scrollTo(0, y); },
  updateSync() {
    const el = $("#sync"); if (!el) return;
    el.innerHTML = `<span class="sync-dot ${Cloud.on ? "on" : ""}"></span>${Cloud.on ? "Đã đồng bộ với tài khoản" : "Lưu trên thiết bị này"}`;
  }
};
document.addEventListener("DOMContentLoaded", () => App.init());

</script>
</body>
</html>
